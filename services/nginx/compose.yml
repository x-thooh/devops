# 手写骨架：不写 image / logging / restart / TZ / networks / IP
# 这些由 scripts/render-all.py 从 base/ 与 stock/network.ini 注入到 .generated/nginx.yml
# 入口只有单实例（DEC-53），节点名因此不带序号（DEC-54）：双实例无 VIP 只是同一故障域的两份副本，属假 HA，已移除。
services:
  nginx:
    x-image: nginx
    profiles: ["nginx"]
    container_name: nginx
    ports:
      - "${ENTRY_HTTP_PORT:-80}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.data/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
