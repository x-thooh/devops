# 手写骨架：不写 image / logging / restart / TZ / networks / IP
# etcd 镜像无 shell，因此用 --config-file（YAML 由 render.sh 生成）
services:
  etcd-1:
    x-image: etcd
    profiles: ["etcd"]
    container_name: etcd-1
    command: ["etcd", "--config-file=/data/active/etcd-1/etcd.yml"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]

  etcd-2:
    x-image: etcd
    profiles: ["etcd"]
    container_name: etcd-2
    command: ["etcd", "--config-file=/data/active/etcd-2/etcd.yml"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]

  etcd-3:
    x-image: etcd
    profiles: ["etcd"]
    container_name: etcd-3
    command: ["etcd", "--config-file=/data/active/etcd-3/etcd.yml"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
