# 手写骨架：不写 image / logging / restart / TZ / networks / IP
services:
  patroni-1:
    x-image: patroni
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["pg"]
    container_name: patroni-1
    user: "0:0"
    entrypoint: ["/bin/sh", "/data/active/patroni-1/entry.sh"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]

  patroni-2:
    x-image: patroni
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["pg"]
    container_name: patroni-2
    user: "0:0"
    entrypoint: ["/bin/sh", "/data/active/patroni-2/entry.sh"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]

  patroni-3:
    x-image: patroni
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["pg"]
    container_name: patroni-3
    user: "0:0"
    entrypoint: ["/bin/sh", "/data/active/patroni-3/entry.sh"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]

  pg-dcs-1:
    x-image: etcd
    profiles: ["pg"]
    container_name: pg-dcs-1
    command: ["etcd", "--config-file=/data/active/pg-dcs-1/etcd.yml"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]

  pg-dcs-2:
    x-image: etcd
    profiles: ["pg"]
    container_name: pg-dcs-2
    command: ["etcd", "--config-file=/data/active/pg-dcs-2/etcd.yml"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]

  pg-dcs-3:
    x-image: etcd
    profiles: ["pg"]
    container_name: pg-dcs-3
    command: ["etcd", "--config-file=/data/active/pg-dcs-3/etcd.yml"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]

  pg-haproxy-1:
    x-image: haproxy
    profiles: ["pg"]
    container_name: pg-haproxy-1
    command: ["-f", "/data/active/pg-haproxy-1/haproxy.cfg"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7000/ >/dev/null"]

  pg-haproxy-2:
    x-image: haproxy
    profiles: ["pg"]
    container_name: pg-haproxy-2
    command: ["-f", "/data/active/pg-haproxy-2/haproxy.cfg"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7000/ >/dev/null"]

  pg-exporter:
    x-image: postgres_exporter
    profiles: ["pg"]
    container_name: pg-exporter
    env_file: ["./data/active/pg-exporter.env"]
