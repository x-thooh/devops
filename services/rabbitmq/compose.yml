# 手写骨架：不写 image / logging / restart / TZ / networks / IP
# hostname 必须固定且唯一（Erlang 节点名 = rabbit@<hostname>），否则重启即"集群分裂"
services:
  rabbit-1:
    x-image: rabbitmq
    profiles: ["rabbitmq"]
    container_name: rabbit-1
    hostname: rabbit-1
    env_file: ./data/active/rabbit-1.env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

  rabbit-2:
    x-image: rabbitmq
    profiles: ["rabbitmq"]
    container_name: rabbit-2
    hostname: rabbit-2
    env_file: ./data/active/rabbit-2.env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

  rabbit-3:
    x-image: rabbitmq
    profiles: ["rabbitmq"]
    container_name: rabbit-3
    hostname: rabbit-3
    env_file: ./data/active/rabbit-3.env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
