# 手写骨架：不写 image / logging / restart / TZ / networks / IP
services:
  mysql-1:
    x-image: mysql
    profiles: ["mysql"]
    container_name: mysql-1
    command: ["mysqld", "--defaults-file=/data/active/mysql-1/my.cnf"]
    env_file: ["./data/active/mysql-1.env"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]

  mysql-2:
    x-image: mysql
    profiles: ["mysql"]
    container_name: mysql-2
    command: ["mysqld", "--defaults-file=/data/active/mysql-2/my.cnf"]
    env_file: ["./data/active/mysql-2.env"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]

  mysql-3:
    x-image: mysql
    profiles: ["mysql"]
    container_name: mysql-3
    command: ["mysqld", "--defaults-file=/data/active/mysql-3/my.cnf"]
    env_file: ["./data/active/mysql-3.env"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]

  mysql-router-1:
    x-image: mysql_router
    profiles: ["mysql"]
    container_name: mysql-router-1
    entrypoint: ["/bin/bash", "/data/active/mysql-router-1/entry.sh"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6446' || exit 1"]

  mysql-router-2:
    x-image: mysql_router
    profiles: ["mysql"]
    container_name: mysql-router-2
    entrypoint: ["/bin/bash", "/data/active/mysql-router-2/entry.sh"]
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6446' || exit 1"]

  mysql-exporter:
    x-image: mysqld_exporter
    profiles: ["mysql"]
    container_name: mysql-exporter
    command: ["--config.my-cnf=/data/active/mysql-exporter.my.cnf"]
    volumes:
      - ./data:/data
