# 手写骨架：不写 image / logging / restart / TZ / networks / IP
# solo：kafka-1 兼任 broker + controller；ha：broker×3 + controller×3
# 配置不走镜像的 KAFKA_* 环境变量包装器（KRaft 校验会误判），由 render.sh 写 server.properties
services:
  kafka-1:
    x-image: kafka
    profiles: ["kafka"]
    container_name: kafka-1
    entrypoint: ["/bin/bash", "/data/active/kafka-1/entry.sh"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]

  kafka-2:
    x-image: kafka
    profiles: ["kafka"]
    container_name: kafka-2
    entrypoint: ["/bin/bash", "/data/active/kafka-2/entry.sh"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]

  kafka-3:
    x-image: kafka
    profiles: ["kafka"]
    container_name: kafka-3
    entrypoint: ["/bin/bash", "/data/active/kafka-3/entry.sh"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]

  kafka-ctrl-1:
    x-image: kafka
    profiles: ["kafka"]
    container_name: kafka-ctrl-1
    entrypoint: ["/bin/bash", "/data/active/kafka-ctrl-1/entry.sh"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller 127.0.0.1:9093 describe --status >/dev/null 2>&1"]

  kafka-ctrl-2:
    x-image: kafka
    profiles: ["kafka"]
    container_name: kafka-ctrl-2
    entrypoint: ["/bin/bash", "/data/active/kafka-ctrl-2/entry.sh"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller 127.0.0.1:9093 describe --status >/dev/null 2>&1"]

  kafka-ctrl-3:
    x-image: kafka
    profiles: ["kafka"]
    container_name: kafka-ctrl-3
    entrypoint: ["/bin/bash", "/data/active/kafka-ctrl-3/entry.sh"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-metadata-quorum.sh --bootstrap-controller 127.0.0.1:9093 describe --status >/dev/null 2>&1"]

  # exporter 用 compose 服务名（不重复 IP）；solo 下 kafka-2/3 未起只会记连接失败
  kafka-exporter:
    x-image: kafka_exporter
    profiles: ["kafka"]
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka-1:9092"
      - "--kafka.server=kafka-2:9092"
      - "--kafka.server=kafka-3:9092"
