# 手写骨架：不写 image / logging / restart / TZ / networks / IP
# 无状态纯浏览（HA 豁免，DEC-46）：内容 = 仓库 docs/，以嵌套只读挂载挂到 /docs/content；
# 站点壳（index.html / assets / _sidebar.md）由 render.sh 渲染到 data/site/ = /docs。
# 不把仓库根挂进容器：避开 env/.env 与 backups/ 被静态服务读到。
# DOCSIFY_AUTO_INIT=false：关掉镜像自举，/docs 缺 index.html 直接退出，不写任何文件。
services:
  docsify-1:
    x-image: docsify
    profiles: ["docsify"]
    container_name: docsify-1
    environment:
      DOCSIFY_AUTO_INIT: "false"
    volumes:
      - ./data/site:/docs
      - ../../docs:/docs/content:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
    mem_limit: 128m
    cpus: 0.5
