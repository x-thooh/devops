# 手写骨架：不写 image / logging / restart / TZ / networks / IP
services:
  mongo-1:
    x-image: mongo
    profiles: ["mongo"]
    container_name: mongo-1
    command: ["mongod", "--config", "/data/active/mongo-1/mongod.conf"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]

  mongo-2:
    x-image: mongo
    profiles: ["mongo"]
    container_name: mongo-2
    command: ["mongod", "--config", "/data/active/mongo-2/mongod.conf"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]

  mongo-3:
    x-image: mongo
    profiles: ["mongo"]
    container_name: mongo-3
    command: ["mongod", "--config", "/data/active/mongo-3/mongod.conf"]
    volumes:
      - ./.data:/data
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1"]

  mongo-exporter:
    x-image: mongodb_exporter
    profiles: ["mongo"]
    container_name: mongo-exporter
    command: ["--collect-all"]
    env_file: ["./.data/active/mongo-exporter.env"]
